<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Job Tracker</title>
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 18px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: bold;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    
    input:focus {
      outline: none;
      border-color: #4285f4;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    button:hover {
      background-color: #357ae8;
    }
    
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    #setupBtn {
      background-color: #34a853;
    }
    
    #setupBtn:hover {
      background-color: #2d9248;
    }
    
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 13px;
    }
    
    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .hidden {
      display: none;
    }
    
    .setup-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }
    
    #sheetIdInput {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>📝 Job Tracker</h2> <span>1.2</span>
  
  <div class="form-group">
    <label for="jobTitle">Job Title:</label>
    <input type="text" id="jobTitle" placeholder="e.g., Software Engineer">
  </div>
  
  <div class="form-group">
    <label for="jobLink">Job Link:</label>
    <input type="url" id="jobLink" placeholder="https://example.com/job">
  </div>
  
  <button id="saveBtn">Save to Google Sheet</button>
  
  <div id="status" class="status hidden"></div>
  
  <div class="setup-section">
    <div class="form-group">
      <label for="sheetId">Google Sheet ID:</label>
      <input type="text" id="sheetId" placeholder="Your spreadsheet ID">
    </div>
    <button id="setupBtn">Save Sheet ID</button>
    <button id="authBtn">Authorize Google Sheets</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
